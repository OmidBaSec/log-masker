[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-masker"
version = "0.9.0"
description = "Mask sensitive data out of raw logs locally, before sending them to an AI for security analysis."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.9 and 3.10 cannot install the patched Starlette / python-multipart.
requires-python = ">=3.11"
authors = [{ name = "Omid Banaei" }]
keywords = ["security", "soc", "logs", "masking", "pii", "redaction", "llm", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "requests>=2.34",
    "keyring>=25.7",
    "msal>=1.38",
    "openpyxl>=3.1",
    "python-multipart>=0.0.32",
    "cryptography>=50.0",
]

[project.urls]
Homepage = "https://github.com/OmidBaSec/log-masker"
Source = "https://github.com/OmidBaSec/log-masker"
Issues = "https://github.com/OmidBaSec/log-masker/issues"
Changelog = "https://github.com/OmidBaSec/log-masker/blob/main/CHANGELOG.md"

[project.scripts]
log-masker = "log_masker.cli:main"

[tool.setuptools]
packages = ["log_masker"]

# The UI ships with the package: app.py resolves it relative to its own file.
[tool.setuptools.package-data]
log_masker = ["static/*"]
