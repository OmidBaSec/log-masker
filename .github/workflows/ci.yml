name: CI

# The whole point of this workflow is that "it runs on macOS, Windows and Linux"
# stays true. Everything below is dependency-free: the suites are plain scripts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # Keyring has no backend on a headless Linux runner — which is exactly
      # the situation keystore.py's encrypted-file tier exists for, so this
      # matrix leg is a real test of it rather than a nuisance.
      - name: Run the test suites
        env:
          LOGMASKER_DATA_DIR: ${{ runner.temp }}/logmasker-data
        run: |
          python test_masker.py
          python test_vault.py
          python test_providers.py
          python test_credits.py
          python test_security.py
          python test_cli.py

      - name: Frontend decoding tests
        run: node test_frontend.js

      - name: Packaging — build a wheel and run the installed console script
        if: matrix.python == '3.13'
        env:
          LOGMASKER_DATA_DIR: ${{ runner.temp }}/logmasker-pkg
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          pip install dist/*.whl
          log-masker where
          log-masker start --port 8899
          log-masker status
          log-masker stop
        shell: bash


  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.lock
          # Audit the installed environment: `-r` builds an isolated venv with
          # ensurepip, which some standalone interpreters do not ship.
          pip-audit --progress-spinner off

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub's runner image happens to ship binfmt handlers, so the arm64
      # leg builds without this — but relying on that is an undocumented
      # dependency on the runner image. Register QEMU explicitly.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The image is documented as multi-arch; prove both targets still build.
      # Multi-platform results cannot be loaded into the daemon, so this step
      # only builds.
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build for this runner and load it
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: log-masker:ci
          cache-from: type=gha

      # A container that starts is not the same as one that works. Check the
      # things the Dockerfile actually promises.
      - name: Smoke test the container
        run: |
          # Same hardening docker-compose.yml specifies, so the documented
          # deployment path is what gets tested — not a laxer one.
          run_container() {
            docker run -d --name "$1" \
              --read-only --tmpfs /tmp --security-opt no-new-privileges \
              -p 127.0.0.1:8888:8888 -v lm-ci-data:/data log-masker:ci
          }
          run_container lm-ci

          # Wait on the image's own HEALTHCHECK rather than a fixed sleep.
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' lm-ci)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { docker logs lm-ci; exit 1; }
            sleep 2
          done
          [ "$status" = "healthy" ] || { echo "never became healthy"; docker logs lm-ci; exit 1; }
          echo "healthcheck: $status"

          H='Host: localhost:8888'

          echo "runs as uid $(docker exec lm-ci id -u)"
          [ "$(docker exec lm-ci id -u)" != "0" ] || { echo "running as root"; exit 1; }

          masked=$(curl -sS -H "$H" -X POST -H 'content-type: application/json' \
            -d '{"logs":"user=jsmith from 10.4.2.19"}' http://127.0.0.1:8888/preview \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["masked"])')
          echo "masking: $masked"
          case "$masked" in *"[USER_"*"[IP_"*) ;; *) echo "no placeholders"; exit 1;; esac
          case "$masked" in *jsmith*|*10.4.2.19*) echo "raw values survived!"; exit 1;; *) ;; esac

          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8888/healthz)
          echo "rebound Host -> $code"; [ "$code" = "403" ] || exit 1

          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "$H" -H 'Origin: https://evil.example' \
            -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:8888/preview)
          echo "cross-origin POST -> $code"; [ "$code" = "403" ] || exit 1

          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "$H" http://127.0.0.1:8888/static/encoding.js)
          echo "static asset -> $code"; [ "$code" = "200" ] || exit 1

          # State must survive the container being destroyed and re-created.
          # `docker restart` would not prove this: it keeps the same writable
          # layer, so the check would pass with no volume mounted at all.
          curl -sS -H "$H" -X POST -H 'content-type: application/json' \
            -d '{"provider":"openai","model":"gpt-5.5"}' http://127.0.0.1:8888/test >/dev/null || true
          count_entries() { docker exec "$1" sh -c 'wc -l < /data/ai_requests.jsonl 2>/dev/null || echo 0' | tr -d ' '; }

          before=$(count_entries lm-ci)
          # Guard against a vacuous pass: if nothing was written there is
          # nothing to prove, and a missing file must not read as "0 == 0".
          [ "$before" -gt 0 ] || { echo "no audit line was written; persistence check would be vacuous"; docker logs lm-ci; exit 1; }

          docker rm -f lm-ci >/dev/null
          run_container lm-ci2
          sleep 8
          after=$(count_entries lm-ci2)
          echo "audit entries before/after re-creation: $before/$after"
          [ "$before" = "$after" ] || { echo "state did not survive container re-creation"; exit 1; }

      - name: Compose file is valid
        run: |
          docker compose config --quiet
          docker compose --profile local config --services

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks needs the whole history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
